# Caddy's packaged unit reads NO environment file. Without this drop-in the
# Caddyfile's {$VIDEOFY_SITE_ADDRESS} always falls back to its default, so the
# site silently stays on plain HTTP -- Caddy says so in the log, once, as a
# warning that is easy to read past:
#
#   "server is listening only on the HTTP port, so no automatic HTTPS
#    will be applied to this server"
#
# A drop-in rather than an edit to /usr/lib/systemd/system/caddy.service: the
# packaged unit is replaced on upgrade, and a deployment that breaks the next
# time Caddy is patched is a deployment that breaks unattended.
[Service]
EnvironmentFile=-/etc/default/caddy
