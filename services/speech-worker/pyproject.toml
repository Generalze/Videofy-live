[project]
name = "videofy-speech-worker"
version = "0.1.0"
description = "Videofy Live speech worker – mock mode for proof of concept"
requires-python = ">=3.11"
dependencies = [
    "python-socketio[client]>=5.11.4",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
